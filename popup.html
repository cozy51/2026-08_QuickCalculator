<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Calculator</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="calculator" aria-label="電卓">
      <header class="titlebar">
        <span class="app-icon" aria-hidden="true">▦</span>
        <h1>標準</h1>
      </header>

      <section class="display" aria-live="polite" aria-atomic="true">
        <div id="expression" class="expression">&nbsp;</div>
        <div id="result" class="result">0</div>
      </section>

      <div class="memory" aria-hidden="true">
        <span>MC</span><span>MR</span><span>M+</span><span>M−</span><span>MS</span><span>M⌄</span>
      </div>

      <section class="keypad" aria-label="電卓のキー">
        <button data-action="percent">%</button>
        <button data-action="ce">CE</button>
        <button data-action="clear">C</button>
        <button data-action="backspace" aria-label="1文字削除">⌫</button>

        <button data-action="reciprocal"><span class="fraction"><span>1</span><span>x</span></span></button>
        <button data-action="square">x²</button>
        <button data-action="sqrt">√x</button>
        <button class="operator" data-operator="/">÷</button>

        <button class="number" data-number="7">7</button>
        <button class="number" data-number="8">8</button>
        <button class="number" data-number="9">9</button>
        <button class="operator" data-operator="*">×</button>

        <button class="number" data-number="4">4</button>
        <button class="number" data-number="5">5</button>
        <button class="number" data-number="6">6</button>
        <button class="operator" data-operator="-">−</button>

        <button class="number" data-number="1">1</button>
        <button class="number" data-number="2">2</button>
        <button class="number" data-number="3">3</button>
        <button class="operator" data-operator="+">＋</button>

        <button class="number" data-action="sign">⁺/₋</button>
        <button class="number" data-number="0">0</button>
        <button class="number" data-action="decimal">.</button>
        <button class="equals" data-action="equals">=</button>
      </section>
    </main>
    <script src="calculator.js"></script>
  </body>
</html>
