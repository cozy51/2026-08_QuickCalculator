<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Quick Calculator">
  <defs>
    <linearGradient id="qc-body" x1="0" y1="0" x2=".85" y2="1">
      <stop offset="0" stop-color="#37a8ee"/>
      <stop offset="1" stop-color="#0a57a4"/>
    </linearGradient>
    <linearGradient id="qc-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset=".55" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="qc-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd66b"/>
      <stop offset="1" stop-color="#f5a623"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="124" height="124" rx="30" fill="url(#qc-body)"/>
  <rect x="2" y="2" width="124" height="124" rx="30" fill="url(#qc-gloss)"/>

  <!-- display -->
  <rect x="20" y="20" width="88" height="26" rx="9" fill="#fff" opacity=".96"/>
  <rect x="80" y="29" width="20" height="8" rx="4" fill="#0a57a4" opacity=".3"/>

  <!-- keypad -->
  <g fill="#fff" opacity=".92">
    <rect x="20" y="56" width="27" height="23" rx="7"/>
    <rect x="53" y="56" width="27" height="23" rx="7"/>
    <rect x="20" y="85" width="27" height="23" rx="7"/>
    <rect x="53" y="85" width="27" height="23" rx="7"/>
  </g>

  <!-- equals key -->
  <rect x="86" y="56" width="22" height="52" rx="8" fill="url(#qc-accent)"/>
</svg>
